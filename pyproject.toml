[project]
name = "mea-india"
version = "0.1.0"
description = "印度外交部（MEA）记者会实录与答记者问抓取与解析工具"
readme = "README.md"
authors = [
    { name = "TerraRiver", email = "20231081107@ucass.edu.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "playwright>=1.50.0",
]

[project.scripts]
mea-india = "mea_india:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
